name: Build Flamingo artwork fix APK

on:
  push:
    branches:
      - fix-android17-artwork
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Generate temporary debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flamingo-android17-artwork-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
