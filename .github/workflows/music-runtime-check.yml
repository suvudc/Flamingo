name: Music Android runtime check
run-name: Music build 35 — full-player scrolling with the drag handle enabled
on:
  push:
    branches: [fix/pixel-media-artwork]
    # These checks cover player gestures; Home queue changes run the unit suite.
    paths:
      - 'app/src/main/java/yos/music/player/MainActivity.kt'
      - 'app/src/main/java/yos/music/player/ui/pages/NowPlaying.kt'
      - 'app/src/main/java/yos/music/player/ui/widgets/bitchord/**'
      - 'app/src/main/java/yos/music/player/ui/widgets/MusicLyrics.kt'
      - 'app/src/androidTest/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Music test signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: music-test-signing-v1
      - name: Build emulator app and interaction tests
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PmusicSmokeAbi=x86_64 --stacktrace
          bash gradlew --stop
          jps -l | awk '$2 == "org.jetbrains.kotlin.daemon.KotlinCompileDaemon" { print $1 }' | xargs -r kill
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise production player and lyric gestures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none -memory 2048 -cores 2
          script: bash scripts/android-interaction-tests.sh
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Music-runtime-diagnostics
          path: |
            runtime-diagnostics/
            runtime-test-results.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
