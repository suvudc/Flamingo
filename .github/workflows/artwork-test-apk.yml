name: Artwork test APK

on:
  push:
    branches: [fix/pixel-media-artwork]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Create debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK and compile artwork tests
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Flamingo-artwork-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
