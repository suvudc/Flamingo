name: Music optimized APK
run-name: Music build 35 — confine handle dragging to the header

on:
  push:
    branches: [fix/pixel-media-artwork]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Music test signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: music-test-signing-v1
      - name: Require the existing Music update signing key
        run: |
          test -f debug.keystore || { echo 'Original Music signing cache is missing'; exit 1; }
      - name: Build optimized APK and run unit tests
        run: bash gradlew :app:assembleOptimized :app:testOptimizedUnitTest --stacktrace
      - name: Verify upgrade signature against build 32
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40545274298 --repo "$GITHUB_REPOSITORY" -n Music-apk -D "$RUNNER_TEMP/music-32"
          old_apk=$(find "$RUNNER_TEMP/music-32" -name '*.apk' -print -quit)
          new_apk=$(find app/build/outputs/apk/optimized -name '*.apk' -print -quit)
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --print-certs "$old_apk" > "$RUNNER_TEMP/music-32-cert.txt"
          "$signer" verify --print-certs "$new_apk" > app/build/signing-verification.txt
          old_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/music-32-cert.txt")
          new_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' app/build/signing-verification.txt)
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$new_apk" > app/build/apk-manifest.txt
          grep -q "package: name='yos.music.player.music' versionCode='35'" app/build/apk-manifest.txt
          sha256sum "$new_apk" > app/build/apk-sha256.txt
          echo 'Verified: build 35 retains the original Music update signing identity.'
      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-apk
          path: app/build/outputs/apk/optimized/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload APK verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Music-apk-verification
          path: |
            app/build/signing-verification.txt
            app/build/apk-manifest.txt
            app/build/apk-sha256.txt
            app/build/test-results/
          if-no-files-found: ignore
