name: Music optimized APK

on:
  push:
    branches: [fix/pixel-media-artwork, feature/octave-glass-library]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Music test signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: music-test-signing-v1
      - name: Create debug signing key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build optimized APK and run unit tests
        run: bash gradlew :app:assembleOptimized :app:testOptimizedUnitTest --stacktrace
      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-apk
          path: app/build/outputs/apk/optimized/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
